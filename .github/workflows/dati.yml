name: dati

# Le corse ECMWF escono a 00/06/12/18 UTC e l'open data arriva ~7-9 h dopo l'ora nominale.
# Le schedule di GitHub partono spesso in ritardo: qui non e' un problema, il lavoro controlla
# qual e' l'ultima corsa pubblicata; pubblica se cambiano ECMWF, allerte o vigilanza DPC.
on:
  schedule:
    - cron: "40 8,14,20,2 * * *"
  workflow_dispatch:
    inputs:
      passi:
        description: "intervallo dei passi, es. 0-72"
        default: "0-72"

concurrency:
  group: dati
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  costruisci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recupera manifest, allerte e vigilanza gia' pubblicati
        id: stato
        run: |
          mkdir -p "$RUNNER_TEMP/dpc-precedente"
          if git fetch --depth=1 origin gh-pages; then
            git show FETCH_HEAD:manifest.json > "$RUNNER_TEMP/dpc-precedente/manifest.json"
            for nome in allerte.json zone-allerta.json vigilanza.json; do
              if git cat-file -e "FETCH_HEAD:$nome" 2>/dev/null; then
                git show "FETCH_HEAD:$nome" > "$RUNNER_TEMP/dpc-precedente/$nome"
              fi
            done
          else
            echo "::warning::gh-pages non recuperato: nessuna copia precedente disponibile"
          fi
          precedente=$(python -c 'import json,os;from pathlib import Path;p=Path(os.environ["RUNNER_TEMP"])/"dpc-precedente/manifest.json";print(json.loads(p.read_text()).get("run","") if p.exists() else "none")')
          echo "precedente=$precedente" >> "$GITHUB_OUTPUT"
          echo "ultima online: $precedente"

      - name: Costruisci i livelli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          costruisci() {
            mkdir -p out
            # Ripristina anche prima del secondo tentativo ECMWF: la copia buona
            # deve sopravvivere sia al retry sia a un guasto della fonte DPC.
            cp "$RUNNER_TEMP/dpc-precedente/"*.json out/ 2>/dev/null || true
            python pipeline/build.py --model ifs --run latest \
              --steps "${{ inputs.passi || '0-72' }}" \
              --layers wind10m,t2m,precip,gust,msl,tcc,rh2m,cape,snow,swh --out out/
          }
          # Il failover fra i mirror copre il 503 su un host solo; se lo stesso oggetto cade su
          # entrambi si aspetta e si ricomincia UNA volta (lo strozzamento dura minuti, non ore).
          # Il secondo fallimento fa fallire il passo davvero: niente verde a vuoto.
          if ! costruisci; then
            echo "::warning::prima passata fallita, pausa di 300 s e secondo tentativo"
            rm -rf out
            sleep 300
            costruisci
          fi

      - name: Verifica novita' ECMWF o DPC
        run: |
          nuova=$(python -c 'import json;print(json.load(open("out/manifest.json"))["run"])')
          echo "corsa prodotta: $nuova (precedente: ${{ steps.stato.outputs.precedente }})"
          test -n "$nuova"
          echo "NUOVA=$nuova" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          nuovo = json.loads(Path("out/manifest.json").read_text())
          path = Path(os.environ["RUNNER_TEMP"]) / "dpc-precedente/manifest.json"
          prima = json.loads(path.read_text()) if path.exists() else {}
          digest = hashlib.sha256(json.dumps(nuovo.get("allerte"), sort_keys=True).encode()).hexdigest()
          vigilanza_digest = hashlib.sha256(json.dumps(nuovo.get("vigilanza"), sort_keys=True).encode()).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"ALLERTE_SHA={digest}\n")
              env.write(f"VIGILANZA_SHA={vigilanza_digest}\n")
              if (nuovo["run"] == prima.get("run") and nuovo.get("layers") == prima.get("layers")
                      and nuovo.get("allerte") == prima.get("allerte")
                      and nuovo.get("vigilanza") == prima.get("vigilanza")):
                  print("::notice::corsa ECMWF, allerte e vigilanza DPC gia' online, niente da pubblicare")
                  env.write("SALTA=1\n")
          PY

      # Un solo commit sempre riscritto: i dati vecchi non servono e il repository resta piccolo.
      - name: Pubblica su Pages
        if: env.SALTA != '1'
        run: |
          cp README.md out/ 2>/dev/null || true
          touch out/.nojekyll
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -q -m "dati $(python -c 'import json;print(json.load(open("manifest.json"))["run"])')"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages

      # Il controllo deve leggere LA CORSA APPENA PUBBLICATA, non "un manifest qualsiasi":
      # il 16/09 diceva "online: 25 passi della corsa 2026091606" mentre aveva appena
      # spedito la 2026091612 (Pages non aveva ancora ricostruito) e passava lo stesso.
      - name: Prova che i dati pubblicati si leggano
        if: env.SALTA != '1'
        run: |
          for tentativo in $(seq 1 15); do
            sleep 20
            if curl -sf "https://alex12345-dot.github.io/colonnello-meteo-dati/manifest.json" -o letto.json \
               && python - <<'PY'
          import hashlib, json, os, sys
          m = json.load(open("letto.json"))
          if m.get("run") != os.environ["NUOVA"]:
              print("Pages serve ancora la corsa", m.get("run"), "attesa", os.environ["NUOVA"])
              sys.exit(3)
          digest = hashlib.sha256(json.dumps(m.get("allerte"), sort_keys=True).encode()).hexdigest()
          if digest != os.environ["ALLERTE_SHA"]:
              print("Pages serve ancora una voce allerte diversa da quella pubblicata")
              sys.exit(3)
          vigilanza_digest = hashlib.sha256(json.dumps(m.get("vigilanza"), sort_keys=True).encode()).hexdigest()
          if vigilanza_digest != os.environ["VIGILANZA_SHA"]:
              print("Pages serve ancora una voce vigilanza diversa da quella pubblicata")
              sys.exit(3)
          assert m["steps"], "manifest senza passi"
          assert m["grid"]["lon0"] == -180.0, "origine della griglia non dichiarata"
          print("online:", len(m["steps"]), "passi della corsa", m["run"])
          PY
            then
              exit 0
            fi
            echo "Pages non ancora aggiornato, ritento ($tentativo)"
          done
          echo "::error::la corsa $NUOVA non e' leggibile da Pages dopo 5 minuti"
          exit 1
